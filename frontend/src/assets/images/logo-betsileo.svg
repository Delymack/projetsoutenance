<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 176" width="232" height="176" role="img" aria-label="Lazan'i Betsileo — Vins de Fianarantsoa">
  <title>Lazan'i Betsileo</title>
  <defs>
    <radialGradient id="lbFond" cx="44%" cy="30%" r="82%">
      <stop offset="0%" stop-color="#FCF6E6"/>
      <stop offset="52%" stop-color="#F1E5C9"/>
      <stop offset="100%" stop-color="#E0CFA7"/>
    </radialGradient>
    <linearGradient id="lbVert" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3B6630"/>
      <stop offset="100%" stop-color="#74A552"/>
    </linearGradient>
    <linearGradient id="lbPaille" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D4A0"/>
      <stop offset="100%" stop-color="#CDB478"/>
    </linearGradient>
    <!-- Arc du haut : ellipse concentrique, rayons valides (demi-ellipse) -->
    <path id="lbArcHaut" d="M 32,92 A 84,60 0 0 1 200,92" fill="none"/>
    <path id="lbArcBas" d="M 41,92 A 75,54 0 0 0 191,92" fill="none"/>
  </defs>

  <!-- ================= Médaillon ovale ================= -->
  <ellipse cx="116" cy="92" rx="105" ry="83" fill="url(#lbFond)"/>
  <ellipse cx="116" cy="92" rx="105" ry="83" fill="none" stroke="#2A2114" stroke-width="4.5"/>
  <ellipse cx="116" cy="92" rx="96" ry="74" fill="none" stroke="#2A2114" stroke-width="1.6"/>

  <!-- ================= Texte courbé ================= -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="16.5" font-weight="700" fill="#33281A" letter-spacing="2.6">
    <textPath href="#lbArcHaut" startOffset="50%" text-anchor="middle">LAZAN' I BETSILEO</textPath>
  </text>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="11" font-weight="700" fill="#4A3A26" letter-spacing="3.4">
    <textPath href="#lbArcBas" startOffset="50%" text-anchor="middle">FIANARANTSOA</textPath>
  </text>

  <!-- Séparateurs losanges à 9h et 3h -->
  <g fill="#33281A">
    <path d="M20,92 l4.5,-4.5 4.5,4.5 -4.5,4.5 Z"/>
    <path d="M212,92 l4.5,-4.5 4.5,4.5 -4.5,4.5 Z"/>
  </g>

  <!-- ================= Plants de riz (verts, à gauche) ================= -->
  <g fill="none" stroke="url(#lbVert)" stroke-width="2.6" stroke-linecap="round">
    <path d="M80,132 C76,116 74,100 78,82"/>
    <path d="M90,132 C88,118 90,102 96,88"/>
    <path d="M70,132 C66,120 68,108 72,96"/>
  </g>
  <!-- Épis en larme -->
  <g fill="#5C8C44">
    <path d="M78,82 c-5,-3 -6,-9 -3,-14 2,4 5,7 9,8 -1,3 -3,5 -6,6 Z"/>
    <path d="M96,88 c-6,-2 -8,-8 -6,-13 2,4 6,7 11,7 -1,3 -3,5 -5,6 Z"/>
    <path d="M72,96 c-5,-2 -7,-8 -5,-13 2,4 6,6 10,6 -1,3 -2,5 -5,7 Z"/>
  </g>
  <g fill="none" stroke="#4F7C3B" stroke-width="1.8" stroke-linecap="round">
    <path d="M74,104 C68,100 64,94 63,86"/>
    <path d="M86,110 C82,104 80,98 80,90"/>
  </g>

  <!-- ================= Portrait du Betsileo (gravure, profil à droite) ================= -->
  <g stroke="#241C10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Épaules / lamba -->
    <path d="M124,110 C120,120 113,128 105,140 L166,140 C158,127 150,117 143,110 C138,113 129,113 124,110 Z" fill="#D9C6A0"/>
    <!-- Motifs du lamba -->
    <path d="M116,126 L155,126 M112,133 L159,133" stroke-width="1.4" opacity="0.55"/>
    <!-- Cou -->
    <path d="M128,100 L132,112" stroke-width="6"/>
    <!-- Visage de profil 3/4 vers la droite -->
    <path d="M128,66 C139,66 145,74 145,85 C145,93 140,101 133,105 C127,108 119,105 117,98 C115,91 119,83 123,75 C125,71 126,66 128,66 Z" fill="#F0DFBC"/>
    <!-- Nez -->
    <path d="M145,84 L150,89 L145,91" fill="#E6D2AC"/>
    <!-- Bouche -->
    <path d="M137,99 C139,100 141,100 142,99" stroke-width="1.5"/>
    <!-- Moustache / bouc -->
    <path d="M125,102 C131,106 137,104 141,100" stroke-width="1.6"/>
    <!-- Sourcil + oeil -->
    <path d="M134,80 L139,79" stroke-width="1.6"/>
    <path d="M134,85 L139,84" stroke-width="1.8"/>
    <!-- Oreille -->
    <path d="M122,86 C120,84 120,82 122,80" stroke-width="1.5"/>
    <!-- Chapeau de paille betsileo : dôme -->
    <path d="M110,68 C112,48 148,48 150,68 Z" fill="url(#lbPaille)"/>
    <!-- Bord large du chapeau -->
    <path d="M100,70 C116,60 144,60 160,70 C156,77 138,73 130,73 C116,73 104,77 100,70 Z" fill="#E4CE97"/>
    <!-- Bandeau du chapeau -->
    <path d="M112,66 C124,62 140,62 150,66" stroke-width="1.4" opacity="0.6"/>
  </g>
</svg>
