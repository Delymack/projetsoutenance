<script>
(function () {
  const $ = (s) => document.querySelector(s);
  $('#valider-produit-{{ produit.pk }}').addEventListener('click', function () {
    const form = $('#form-produit-{{ produit.pk }}');
    const nom = form.querySelector('[name=nom]');
    const prix = form.querySelector('[name=prix_vente]');
    const cout = form.querySelector('[name=cout_revenir]');
    if (!nom.value.trim()) { nom.classList.add('is-invalid'); setTimeout(() => nom.classList.remove('is-invalid'), 2000); return false; }
    if (!prix.value || parseFloat(prix.value) < 0) { prix.classList.add('is-invalid'); setTimeout(() => prix.classList.remove('is-invalid'), 2000); return false; }
    if (!cout.value || parseFloat(cout.value) < 0) { cout.classList.add('is-invalid'); setTimeout(() => cout.classList.remove('is-invalid'), 2000); return false; }
    form.submit();
  });
})();
</script>

<!-- =================================================================== -->
<!-- Fenêtre modale de modification de produit -->
<div id="modal-produit-{{ produit.pk }}" class="modal-overlay" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="titre-produit-{{ produit.pk }}">
  <div class="modal" role="document">
    <div class="modal-header">
      <h2 id="titre-produit-{{ produit.pk }}" class="modal-title">Modifier le produit</h2>
      <button type="button" class="modal-close" aria-label="Fermer" data-bs-dismiss="modal" id="close-produit-{{ produit.pk }}">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <form id="form-produit-{{ produit.pk }}"
            action="{% url 'produits:produit_modifier' produit.pk %}"
            method="post" novalidate>
        {% csrf_token %}
        <input type="hidden" name="action" value="modifier">

        <div class="row mb-3">
          <div class="col-sm-6">
            <label class="form-label">Nom *</label>
            <input type="text" class="form-control" name="nom" value="{{ produit.nom }}" required maxlength="200">
          </div>
          <div class="col-sm-6">
            <label class="form-label">Catégorie *</label>
            <select class="form-select" name="categorie_id" required>
              {% for c in categories %}
                <option value="{{ c.pk }}" {% if c.pk|stringformat:'s' == produit.categorie.pk|stringformat:'s' %}selected{% endif %}>{{ c.nom }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-sm-6">
            <label class="form-label">Type de vin *</label>
            <select class="form-select" name="type_vin" required>
              {% for k, v in type_vin_choices %}
                <option value="{{ k }}" {% if k == produit.type_vin %}selected{% endif %}>{{ v }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-sm-6">
            <label class="form-label">Unité de vente *</label>
            <select class="form-select" name="unite_vente" required>
              {% for k, v in unite_vente_choices %}
                <option value="{{ k }}" {% if k == produit.unite_vente %}selected{% endif %}>{{ v }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-sm-6">
            <label class="form-label">Prix de vente HT *</label>
            <div class="input-group">
              <span class="input-group-text">Ar</span>
              <input type="number" class="form-control" name="prix_vente" value="{{ produit.prix_vente }}" min="0" step="0.01" required>
            </div>
          </div>
          <div class="col-sm-6">
            <label class="form-label">Prix de revient (cout) *</label>
            <div class="input-group">
              <span class="input-group-text">Ar</span>
              <input type="number" class="form-control" name="cout_revenir" value="{{ produit.cout_revenir }}" min="0" step="0.01" required>
            </div>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-sm-6">
            <label class="form-label">Contenance</label>
            <input type="number" class="form-control" name="contenance" value="{{ produit.contenance }}" min="1" step="1">
          </div>
          <div class="col-sm-6">
            <label class="form-label">Prix du lot</label>
            <div class="input-group">
              <span class="input-group-text">Ar</span>
              <input type="number" class="form-control" name="prix_conditionnement" value="{{ produit.prix_conditionnement }}" min="0" step="0.01">
            </div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea class="form-control" name="description" rows="2" maxlength="2000">{{ produit.description }}</textarea>
        </div>

        <div class="row mb-3">
          <div class="col-sm-6">
            <label class="form-label">Code-barres</label>
            <input type="text" class="form-control" name="code_barre" value="{{ produit.code_barre }}" maxlength="64">
          </div>
          <div class="col-sm-6">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" name="statut" id="statut-produit-{{ produit.pk }}" {% if produit.statut %}checked{% endif %}>
              <label class="form-check-label" for="statut-produit-{{ produit.pk }}">Actif</label>
            </div>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" id="annuler-produit-{{ produit.pk }}">Annuler</button>
      <button type="submit" form="form-produit-{{ produit.pk }}" class="btn btn-primary" id="valider-produit-{{ produit.pk }}">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Valider la modification
      </button>
    </div>
  </div>
</div>
