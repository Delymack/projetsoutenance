<script>
(function () {
  const $ = (s) => document.querySelector(s);
  $('#valider-client-{{ client.pk }}').addEventListener('click', function () {
    const form = $('#form-client-{{ client.pk }}');
    const nom = form.querySelector('[name=nom]');
    const prenom = form.querySelector('[name=prenom]');
    const telephone = form.querySelector('[name=telephone]');
    const points = form.querySelector('[name=points_fidelite]');
    if (!nom.value.trim()) { nom.classList.add('is-invalid'); setTimeout(() => nom.classList.remove('is-invalid'), 2000); return false; }
    if (!prenom.value.trim()) { prenom.classList.add('is-invalid'); setTimeout(() => prenom.classList.remove('is-invalid'), 2000); return false; }
    if (!telephone.value.trim()) { telephone.classList.add('is-invalid'); setTimeout(() => telephone.classList.remove('is-invalid'), 2000); return false; }
    if (!points.value || parseInt(points.value) < 0) { points.classList.add('is-invalid'); setTimeout(() => points.classList.remove('is-invalid'), 2000); return false; }
    form.submit();
  });
})();
</script>

<!-- =================================================================== -->
<!-- Fenêtre modale de modification de client -->
<div id="modal-client-{{ client.pk }}" class="modal-overlay" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="titre-client-{{ client.pk }}">
  <div class="modal" role="document">
    <div class="modal-header">
      <h2 id="titre-client-{{ client.pk }}" class="modal-title">Modifier le client</h2>
      <button type="button" class="modal-close" aria-label="Fermer" data-bs-dismiss="modal" id="close-client-{{ client.pk }}">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <form id="form-client-{{ client.pk }}"
            action="{% url 'clients:client_modifier' client.pk %}"
            method="post" novalidate>
        {% csrf_token %}
        <input type="hidden" name="action" value="modifier">

        <div class="row mb-3">
          <div class="col-sm-6">
            <label class="form-label">Nom *</label>
            <input type="text" class="form-control" name="nom" value="{{ client.nom }}" required maxlength="100">
          </div>
          <div class="col-sm-6">
            <label class="form-label">Prénom *</label>
            <input type="text" class="form-control" name="prenom" value="{{ client.prenom }}" required maxlength="100">
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-sm-6">
            <label class="form-label">Téléphone *</label>
            <input type="text" class="form-control" name="telephone" value="{{ client.telephone }}" required maxlength="20">
          </div>
          <div class="col-sm-6">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" value="{{ client.email }}" maxlength="254">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Adresse</label>
          <textarea class="form-control" name="adresse" rows="2" maxlength="600">{{ client.adresse }}</textarea>
        </div>

        <div class="row mb-3">
          <div class="col-sm-6">
            <label class="form-label">Type de client *</label>
            <select class="form-select" name="type_client">
              {% for k, v in type_client_choices %}
                <option value="{{ k }}" {% if k == client.type_client %}selected{% endif %}>{{ v }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-sm-6">
            <label class="form-label">Niveau *</label>
            <select class="form-select" name="niveau">
              {% for k, v in niveau_choices %}
                <option value="{{ k }}" {% if k == client.niveau %}selected{% endif %}>{{ v }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-sm-6">
            <label class="form-label">Points fidélité *</label>
            <input type="number" class="form-control" name="points_fidelite" value="{{ client.points_fidelite }}" min="0" required>
          </div>
          <div class="col-sm-6">
            <label class="form-label">Plafond crédit</label>
            <input type="number" class="form-control" name="max_credit" value="{{ client.max_credit }}" min="0" step="0.01">
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-sm-6">
            <label class="form-label">Encours (solde du)</label>
            <input type="number" class="form-control" name="solde_du" value="{{ client.solde_du }}" min="0" step="0.01">
          </div>
          <div class="col-sm-6">
            <label class="form-label">Date création</label>
            <input type="text" class="form-control" value="{{ client.date_creation|date:'d/m/Y H:i' }}" readonly>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" id="annuler-client-{{ client.pk }}">Annuler</button>
      <button type="submit" form="form-client-{{ client.pk }}" class="btn btn-primary" id="valider-client-{{ client.pk }}">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Valider la modification
      </button>
    </div>
  </div>
</div>
