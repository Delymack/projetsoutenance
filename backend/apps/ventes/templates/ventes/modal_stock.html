<script>
(function () {
  const $ = (s) => document.querySelector(s);
  $('#valider-stock-{{ stock.pk }}').addEventListener('click', function () {
    const form = $('#form-stock-{{ stock.pk }}');
    const quantite = form.querySelector('[name=quantite]');
    const seuil = form.querySelector('[name=seuil_alerte]');
    if (!quantite.value || parseInt(quantite.value) < 0) { quantite.classList.add('is-invalid'); setTimeout(() => quantite.classList.remove('is-invalid'), 2000); return false; }
    if (!seuil.value || parseInt(seuil.value) < 0) { seuil.classList.add('is-invalid'); setTimeout(() => seuil.classList.remove('is-invalid'), 2000); return false; }
    form.submit();
  });
})();
</script>

<!-- =================================================================== -->
<!-- Fenêtre modale de modification de stock -->
<div id="modal-stock-{{ stock.pk }}" class="modal-overlay" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="titre-stock-{{ stock.pk }}">
  <div class="modal" role="document">
    <div class="modal-header">
      <h2 id="titre-stock-{{ stock.pk }}" class="modal-title">Modifier le stock</h2>
      <button type="button" class="modal-close" aria-label="Fermer" data-bs-dismiss="modal" id="close-stock-{{ stock.pk }}">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <form id="form-stock-{{ stock.pk }}"
            action="{% url 'stocks:stock_modifier' stock.pk %}"
            method="post" novalidate>
        {% csrf_token %}
        <input type="hidden" name="action" value="modifier">

        <div class="row mb-3">
          <div class="col-sm-6">
            <label class="form-label">Produit *</label>
            <select class="form-select" name="produit_id" required>
              {% for p in produits %}
                <option value="{{ p.pk }}" {% if p.pk|stringformat:'s' == stock.produit.pk|stringformat:'s' %}selected{% endif %}>{{ p.nom }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-sm-6">
            <label class="form-label">État actuel</label>
            <span class="badge bg-{{ stock.etat_stock|default:'secondary' }}">{{ stock.etat_stock }}</span>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-sm-6">
            <label class="form-label">Quantité actuelle *</label>
            <input type="number" class="form-control" name="quantite" value="{{ stock.quantite }}" min="0" required>
          </div>
          <div class="col-sm-6">
            <label class="form-label">Seuil d'alerte *</label>
            <input type="number" class="form-control" name="seuil_alerte" value="{{ stock.seuil_alerte }}" min="0" required>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-sm-6">
            <label class="form-label">Besoin de réapprovisionnement</label>
            <input type="number" class="form-control" value="{{ stock.besoin_reappro }}" readonly>
            <small class="text-muted">(2 * seuil - quantité)</small>
          </div>
          <div class="col-sm-6">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" name="actif" id="actif-stock-{{ stock.pk }}" {% if stock.actif %}checked{% endif %}>
              <label class="form-check-label" for="actif-stock-{{ stock.pk }}">Activé</label>
            </div>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" id="annuler-stock-{{ stock.pk }}">Annuler</button>
      <button type="submit" form="form-stock-{{ stock.pk }}" class="btn btn-primary" id="valider-stock-{{ stock.pk }}">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Valider la modification
      </button>
    </div>
  </div>
</div>
